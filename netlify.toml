[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Main domain redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Admin subdomain handling
[[redirects]]
  from = "https://admin.afritix.net/*"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

# Organizer subdomain handling  
[[redirects]]
  from = "https://organizer.afritix.net/*"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Role = ["organizer"]}

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://uwmlagvsivxqocklxbbo.supabase.co https://wlyncuwbzhzjafmqozcm.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://uwmlagvsivxqocklxbbo.supabase.co wss://uwmlagvsivxqocklxbbo.supabase.co https://wlyncuwbzhzjafmqozcm.supabase.co wss://wlyncuwbzhzjafmqozcm.supabase.co https://api.stripe.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com; frame-src https://js.stripe.com;"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/blog-sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Deep linking files for mobile apps
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

[[edge_functions]]
  function = "og-tags"
  path = "/"

[[edge_functions]]
  function = "og-tags"
  path = "/events"

[[edge_functions]]
  function = "og-tags"
  path = "/events/*"

[[edge_functions]]
  function = "og-tags"
  path = "/e/*"

[[edge_functions]]
  function = "og-tags"
  path = "/attractions"

[[edge_functions]]
  function = "og-tags"
  path = "/venues"

[[edge_functions]]
  function = "og-tags"
  path = "/venues/*"

[[edge_functions]]
  function = "og-tags"
  path = "/organizers"

[[edge_functions]]
  function = "og-tags"
  path = "/organizers/*"

[[edge_functions]]
  function = "og-tags"
  path = "/artists"

[[edge_functions]]
  function = "og-tags"
  path = "/artists/*"

[[edge_functions]]
  function = "og-tags"
  path = "/categories"

[[edge_functions]]
  function = "og-tags"
  path = "/categories/*"

[[edge_functions]]
  function = "og-tags"
  path = "/blog"

[[edge_functions]]
  function = "og-tags"
  path = "/blog/post/*"

[[edge_functions]]
  function = "og-tags"
  path = "/support"

[[edge_functions]]
  function = "og-tags"
  path = "/tags/*"

[[edge_functions]]
  function = "og-tags"
  path = "/ref/*"

[[edge_functions]]
  function = "og-tags"
  path = "/ouagadougou"

[[edge_functions]]
  function = "og-tags"
  path = "/bobo-dioulasso"

[[edge_functions]]
  function = "og-tags"
  path = "/abidjan"

[[edge_functions]]
  function = "og-tags"
  path = "/dakar"

# WhatsApp share: /w/SLUG → wa.me (no meta-refresh, not og-tags)
[[edge_functions]]
  function = "wa-share"
  path = "/w/*"